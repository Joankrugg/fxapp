<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedalboard Vintage</title>
  <link rel="stylesheet" href="distortion.css">
  <link rel="stylesheet" href="pedalboard.css">
</head>
<body>
  <div class="pedalboard-container">
    <h1 class="pedalboard-title">Pedalboard Vintage</h1>
    <button id="start-mic" class="main-btn">Activer le micro</button>
    <div id="status"></div>
    <div class="pedal-row">
      <!-- EQ -->
      <div class="pedal eq">
        <h2>EQ</h2>
        <label><input type="checkbox" id="eq-on" checked> On <span class="led" id="eq-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="eq-bass">Bass</label><input type="range" id="eq-bass" min="-15" max="15" step="1" value="0"></div>
          <div class="knob-group"><label for="eq-mid">Mid</label><input type="range" id="eq-mid" min="-15" max="15" step="1" value="0"></div>
          <div class="knob-group"><label for="eq-treble">Treble</label><input type="range" id="eq-treble" min="-15" max="15" step="1" value="0"></div>
        </div>
      </div>
      <!-- Fuzz -->
      <div class="pedal fuzz">
        <h2>Fuzz</h2>
        <label><input type="checkbox" id="fuzz-on" checked> On <span class="led" id="fuzz-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="fuzz-gain">Gain</label><input type="range" id="fuzz-gain" min="0" max="1" step="0.01" value="0.7"></div>
          <div class="knob-group"><label for="fuzz-tone">Tone</label><input type="range" id="fuzz-tone" min="0" max="1" step="0.01" value="0.5"></div>
          <div class="knob-group"><label for="fuzz-volume">Volume</label><input type="range" id="fuzz-volume" min="0" max="1" step="0.01" value="0.7"></div>
        </div>
      </div>
      <!-- Tremolo -->
      <div class="pedal tremolo">
        <h2>Tremolo</h2>
        <label><input type="checkbox" id="tremolo-on" checked> On <span class="led" id="tremolo-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="tremolo-rate">Rate</label><input type="range" id="tremolo-rate" min="0.1" max="10" step="0.01" value="4"></div>
          <div class="knob-group"><label for="tremolo-depth">Depth</label><input type="range" id="tremolo-depth" min="0" max="1" step="0.01" value="0.7"></div>
        </div>
      </div>
      <!-- Chorus -->
      <div class="pedal chorus">
        <h2>Chorus</h2>
        <label><input type="checkbox" id="chorus-on" checked> On <span class="led" id="chorus-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="chorus-rate">Rate</label><input type="range" id="chorus-rate" min="0.1" max="5" step="0.01" value="1.5"></div>
          <div class="knob-group"><label for="chorus-depth">Depth</label><input type="range" id="chorus-depth" min="0" max="1" step="0.01" value="0.5"></div>
          <div class="knob-group"><label for="chorus-mix">Mix</label><input type="range" id="chorus-mix" min="0" max="1" step="0.01" value="0.5"></div>
        </div>
      </div>
      <!-- Flanger -->
      <div class="pedal flanger">
        <h2>Flanger</h2>
        <label><input type="checkbox" id="flanger-on" checked> On <span class="led" id="flanger-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="flanger-rate">Rate</label><input type="range" id="flanger-rate" min="0.1" max="5" step="0.01" value="0.5"></div>
          <div class="knob-group"><label for="flanger-depth">Depth</label><input type="range" id="flanger-depth" min="0" max="1" step="0.01" value="0.5"></div>
          <div class="knob-group"><label for="flanger-mix">Mix</label><input type="range" id="flanger-mix" min="0" max="1" step="0.01" value="0.5"></div>
        </div>
      </div>
      <!-- Delay -->
      <div class="pedal delay">
        <h2>Delay</h2>
        <label><input type="checkbox" id="delay-on" checked> On <span class="led" id="delay-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="delay-time">Time</label><input type="range" id="delay-time" min="0" max="1" step="0.01" value="0.3"></div>
          <div class="knob-group"><label for="delay-feedback">Feedback</label><input type="range" id="delay-feedback" min="0" max="0.95" step="0.01" value="0.4"></div>
          <div class="knob-group"><label for="delay-mix">Mix</label><input type="range" id="delay-mix" min="0" max="1" step="0.01" value="0.5"></div>
        </div>
      </div>
      <!-- Reverb -->
      <div class="pedal reverb">
        <h2>Reverb</h2>
        <label><input type="checkbox" id="reverb-on" checked> On <span class="led" id="reverb-led"></span></label>
        <div class="knobs">
          <div class="knob-group"><label for="reverb-mix">Mix</label><input type="range" id="reverb-mix" min="0" max="1" step="0.01" value="0.4"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="pedalboard.js"></script>
</body>
</html>
