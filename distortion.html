<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pédale Distorsion Vintage</title>
  <link rel="stylesheet" href="distortion.css">
</head>
<body>
  <div class="pedal-container">
    <h1 class="pedal-title">Danelectro Style Distorsion</h1>
    <div class="knobs">
      <div class="knob-group">
        <label for="gain">Gain</label>
        <input type="range" id="gain" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="knob-group">
        <label for="tone">Tonalité</label>
        <input type="range" id="tone" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="knob-group">
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
      </div>
      <div class="knob-group">
        <label for="mix">Mix</label>
        <input type="range" id="mix" min="0" max="1" step="0.01" value="0.7">
      </div>
    </div>
    <button id="start">Activer le micro</button>
    <div id="status"></div>
  </div>
  <script src="distortion.js"></script>
</body>
</html>
